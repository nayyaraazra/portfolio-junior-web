<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Antrean Loket</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; color: #1f2937; }
    #dipanggil { font-size: 2.5rem; color: #1d4ed8; }
    button { padding: .5rem 1rem; margin: .25rem .25rem .25rem 0; font-size: 1rem; cursor: pointer; }
    #reset { background: #fee2e2; border: 1px solid #ef4444; }
    h2 { font-size: 1rem; margin-top: 1.5rem; }
    small { color: #6b7280; }
  </style>
</head>
<body>
  <h1>Antrean Loket</h1>
  <p>Sedang dipanggil: <strong id='dipanggil'>-</strong></p>
  <p>Menunggu: <span id='jumlah'>0</span></p>
  <button id='ambil'>Ambil Nomor</button>
  <button id='panggil'>Panggil Berikutnya</button>
  <button id='reset'>Reset</button>
  <h2>Daftar menunggu</h2>
  <ol id='daftar'></ol>
  <h2>Riwayat 5 nomor terakhir dipanggil</h2>
  <ul id='riwayat'></ul>
  <small id='tanggal'></small>
  <script type='module' src='js/antrian.js'></script>
</body>
</html>
