 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <style>
    .box {
        display: flex;
        gap:100px;
        padding-left:50px;    
    }
    .kotak{
        width: 100px;
        height: 100px;
        background-color: #3338a8;
        color:#fff; 
        display: flex;
        justify-content: center;
        align-items: center;
    }
 </style>
 <body>
    <div class="box">
        <div class="kotak">1</div>
        <div class="kotak">2</div>
        <div class="kotak">3</div>
    </div>
 </body>
 </html>
