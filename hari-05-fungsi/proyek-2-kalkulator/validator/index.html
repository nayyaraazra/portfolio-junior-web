<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="kartu">
    <h1>Form Pendaftaran</h1>
    <p>Isi semua data dengan benar untuk mendaftar.</p>

    <form id="form-daftar" novalidate>
      <div class="field">
        <label for="nama">Nama lengkap</label>
        <input id="nama" name="nama" autocomplete="name" aria-describedby="galat-nama">
        <small id="galat-nama" class="galat" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" aria-describedby="galat-email">
        <small id="galat-email" class="galat" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="hp">Nomor HP</label>
        <input id="hp" name="hp" type="tel" inputmode="numeric" autocomplete="tel" aria-describedby="galat-hp">
        <small id="galat-hp" class="galat" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="sandi">Kata sandi</label>
        <input id="sandi" name="sandi" type="password" autocomplete="new-password" aria-describedby="galat-sandi">
        <small id="galat-sandi" class="galat" aria-live="polite"></small>
      </div>

      <div class="field">
        <label for="konfirmasi">Konfirmasi kata sandi</label>
        <input id="konfirmasi" name="konfirmasi" type="password" autocomplete="new-password" aria-describedby="galat-konfirmasi">
        <small id="galat-konfirmasi" class="galat" aria-live="polite"></small>
      </div>

      <button id="kirim" type="submit" disabled>Kirim pendaftaran</button>
    </form>

    <section id="ringkasan" class="ringkasan" aria-live="polite" hidden>
      <h2>Pendaftaran berhasil</h2>
      <p id="ringkasan-data"></p>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
